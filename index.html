<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YING TANG HONG INVESTMENT</title>
  <meta name="description" content="Ying Tang Hong Investment (英登行投资) — a Hong Kong based private investment vehicle connecting markets and creating long-term value. Founded in 1990.">

  <!-- Favicon: YTH monogram -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230a1a2f'/%3E%3Ctext x='32' y='44' font-size='30' text-anchor='middle' fill='%23c9a96a' font-family='Georgia,serif' font-weight='bold'%3EYTH%3C/text%3E%3C/svg%3E">

  <style>
    :root{
      --navy:#0a1a2f;
      --navy-2:#0d2038;
      --gold:#c9a96a;
      --gold-soft:#e2c895;
      --cream:#f4efe6;
      --muted:#9fb0c3;
      --line:rgba(201,169,106,.28);
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--navy);
      color:var(--cream);
      line-height:1.65;
      -webkit-font-smoothing:antialiased;
    }
    h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.5px}
    a{color:inherit;text-decoration:none}

    /* ---------- NAV ---------- */
    nav{
      position:fixed;top:0;left:0;right:0;z-index:50;
      display:flex;align-items:center;justify-content:space-between;
      padding:18px clamp(20px,5vw,64px);
      background:linear-gradient(180deg,rgba(10,26,47,.92),rgba(10,26,47,0));
      transition:background .3s ease;
    }
    nav.scrolled{background:rgba(10,26,47,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:baseline;gap:10px}
    .brand .en{font-family:Georgia,serif;font-size:18px;letter-spacing:2px;color:var(--gold)}
    .brand .cn{font-size:14px;color:var(--cream);opacity:.85}
    .nav-links{display:flex;gap:28px;font-size:14px;letter-spacing:1px}
    .nav-links a{opacity:.85;transition:color .2s,opacity .2s}
    .nav-links a:hover{color:var(--gold);opacity:1}
    @media(max-width:640px){.nav-links{display:none}}

    /* ---------- HERO ---------- */
    .hero{
      position:relative;min-height:100vh;min-height:100dvh;
      display:flex;align-items:center;
      padding:0 clamp(20px,5vw,64px);
      overflow:hidden;
    }
    .hero-bg{
      position:absolute;inset:0;z-index:-2;
      background-image:url('assets/yingtanghong-hero.jpg');
      background-repeat:no-repeat;
      background-size:cover;background-position:center;
    }
    .hero-bg::after{
      content:"";position:absolute;inset:0;
      background:linear-gradient(105deg,rgba(10,26,47,.86) 0%,rgba(10,26,47,.55) 45%,rgba(10,26,47,.25) 100%);
    }
    .hero-inner{max-width:680px}
    .eyebrow{
      display:inline-block;font-size:13px;letter-spacing:4px;text-transform:uppercase;
      color:var(--gold);margin-bottom:22px;
      border:1px solid var(--line);padding:6px 14px;border-radius:2px;
    }
    .hero h1{
      font-size:clamp(34px,6vw,68px);line-height:1.05;color:#fff;
      text-shadow:0 2px 30px rgba(0,0,0,.4);
    }
    .hero h1 .cn{display:block;font-size:clamp(22px,3.4vw,38px);color:var(--gold-soft);margin-top:10px;letter-spacing:6px}
    .tagline{
      margin-top:24px;font-size:clamp(15px,2vw,19px);color:var(--cream);
      font-style:italic;opacity:.92;max-width:560px;
    }
    .founded{
      margin-top:30px;display:inline-flex;align-items:center;gap:12px;
      font-size:14px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;
    }
    .founded b{font-family:Georgia,serif;font-size:22px;color:var(--gold);letter-spacing:1px}
    .cta-row{margin-top:38px;display:flex;gap:16px;flex-wrap:wrap}
    .btn{
      padding:13px 28px;font-size:14px;letter-spacing:1.5px;border-radius:2px;
      border:1px solid var(--gold);transition:all .25s ease;cursor:pointer;
    }
    .btn.primary{background:var(--gold);color:var(--navy);font-weight:600}
    .btn.primary:hover{background:var(--gold-soft)}
    .btn.ghost{color:var(--cream)}
    .btn.ghost:hover{background:rgba(201,169,106,.12)}

    /* ---------- FOOTER ---------- */
    footer{
      padding:28px clamp(20px,5vw,64px);
      border-top:1px solid var(--line);
      display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;
      font-size:13px;color:var(--muted);
    }
    footer .en{color:var(--gold);font-family:Georgia,serif;letter-spacing:1px}

    /* ---------- RESPONSIVE: laptops & monitors ---------- */
    /* Large external monitors (>=1920px wide): frame the skyline, let type breathe */
    @media (min-width:1920px){
      .hero-bg{background-position:50% 38%}
      .hero-inner{max-width:760px}
      .hero h1{font-size:clamp(40px,5vw,76px)}
      .hero h1 .cn{font-size:clamp(24px,3vw,42px)}
      .tagline{font-size:clamp(16px,1.4vw,20px)}
    }
    /* Wide / ultrawide monitors: avoid over-zoom cropping the skyline */
    @media (min-aspect-ratio:2/1){
      .hero-bg{background-size:auto 100%;background-position:center}
    }
    /* Common laptop heights (~720-820px): tighten vertical rhythm so content never clips */
    @media (max-height:820px){
      .hero{padding-top:72px;padding-bottom:48px}
      .eyebrow{margin-bottom:16px}
      .tagline{margin-top:16px}
      .founded{margin-top:20px}
      .cta-row{margin-top:24px}
    }
    /* Compact laptops / smaller widths */
    @media (max-width:1280px){
      .hero-inner{max-width:600px}
    }
  </style>
</head>
<body>

  <nav id="nav">
    <div class="brand">
      <span class="en">YTH</span>
      <span class="cn">英登行投资</span>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-bg"></div>
    <div class="hero-inner">
    
    </div>
  </header>

  <footer>
    <span class="en">YING TANG HONG INVESTMENT</span>
    <span>© 1990–2026 YTH · Hong Kong</span>
  </footer>

  <script>
    const nav = document.getElementById('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('scrolled', window.scrollY > 40);
    });
  </script>
</body>
</html>
